[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tapediag"
version = "0.3.0"
description = "Read-only Linux tape diagnostics with offline parsers and safe command planning"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Mitchel Tighe"}]
maintainers = [{name = "Mitchel Tighe"}]
license-files = ["LICENSE", "fixtures/NOTICES.md"]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://github.com/MitchelTighe/tape-diag-kit"
Issues = "https://github.com/MitchelTighe/tape-diag-kit/issues"

[project.scripts]
tapediag = "tapediag.cli:main"
dta = "tapediag.dta:main"

[project.optional-dependencies]
dta = ["tomli==2.3.0; python_version < '3.11'"]

[tool.setuptools]
packages = ["tapediag"]

[tool.setuptools.package-data]
tapediag = ["tapealert_flags.json", "report_schema.json", "report_schema_v2.json", "report_schema_v3.json", "dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]
markers = ["slow: generated multi-gigabyte LTFS resource test (opt in with LTFS_RUN_SLOW=1)"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
# Fatal syntax/control-flow/name errors; avoid a release-only formatting sweep.
select = ["E9", "F63", "F7", "F82"]

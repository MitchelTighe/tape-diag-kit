name: diagnostics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python:3.13.9-slim-bookworm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m pip install --disable-pip-version-check -r requirements-lint.txt
      - run: sh scripts/check-lint.sh
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate workflow syntax and expressions
        run: docker run --rm --network=none -v "$GITHUB_WORKSPACE:/src:ro" -w /src docker.io/rhysd/actionlint:1.7.7 -color .github/workflows/ci.yml
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["python:3.9.25-slim-bookworm", "python:3.13.9-slim-bookworm"]
    container:
      image: ${{ matrix.image }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - run: python scripts/build-release.py --output dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: cd /tmp && python "$GITHUB_WORKSPACE/scripts/smoke-installed.py"
      - run: cd /tmp && python "$GITHUB_WORKSPACE/scripts/smoke-installed-dta.py"
      - run: pytest -q
      - run: python scripts/check-dist-v3.py --dist dist
      - name: Test the source distribution
        run: |
          mkdir /tmp/tapediag-sdist
          tar -xzf dist/tapediag-0.3.0.tar.gz -C /tmp/tapediag-sdist
          cd /tmp/tapediag-sdist/tapediag-0.3.0
          pytest -q
      - run: PYTHONPATH=. python scripts/verify-v3.py
      - run: python scripts/audit-identifiers.py
      - run: sh scripts/mhvtl-quickstart.sh
      - run: python scripts/audit-public-source.py --output /tmp/privacy-source.json
